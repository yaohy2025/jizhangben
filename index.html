<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随手账 · 杨倩倩记账本</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17251c;--ink2:#5c6b60;--paper:#fbfaf5;--bg:#e6ebe1;
  --green:#0e6b4a;--green-deep:#0a4a34;--green-soft:#e3efe7;
  --red:#c8402f;--red-soft:#f9e9e5;--income:#178a5f;
  --amber:#e9b949;--line:#dde2d5;--gold:#e9b949;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans SC',sans-serif;color:var(--ink);background:var(--bg);
  background-image:linear-gradient(rgba(14,107,74,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(14,107,74,.055) 1px,transparent 1px);
  background-size:28px 28px;display:flex;justify-content:center}
.disp{font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;font-weight:400;letter-spacing:1px}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient span{position:absolute;font-family:'ZCOOL QingKe HuangYou';color:rgba(14,107,74,.08);animation:floaty 16s ease-in-out infinite alternate}
.ambient span:nth-child(1){font-size:140px;top:6%;left:4%}
.ambient span:nth-child(2){font-size:90px;top:60%;left:8%;animation-duration:20s}
.ambient span:nth-child(3){font-size:120px;top:14%;right:5%;animation-duration:13s}
.ambient span:nth-child(4){font-size:70px;bottom:8%;right:9%;animation-duration:18s}
@keyframes floaty{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-34px) rotate(5deg)}}

.app{position:relative;z-index:1;width:100%;max-width:430px;min-height:100dvh;background:var(--paper);box-shadow:0 0 60px rgba(23,37,28,.18)}
main{padding:16px 16px 110px}

.app-head{position:relative;overflow:hidden;color:#f3f1e4;padding:18px 18px 24px;background:linear-gradient(160deg,#0d5c40,#0a4a34 55%,#073626)}
.app-head::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 10px,rgba(255,255,255,.035) 10px 11px)}
.app-head::after{content:'¥';position:absolute;right:-24px;top:-52px;font:400 180px/1 'ZCOOL QingKe HuangYou';color:rgba(255,255,255,.055)}
.glow{position:absolute;width:260px;height:260px;border-radius:50%;left:-80px;top:-100px;background:radial-gradient(circle,rgba(233,185,73,.22),transparent 65%);animation:glowmove 9s ease-in-out infinite alternate}
@keyframes glowmove{to{transform:translate(60px,40px)}}
.head-top{position:relative;display:flex;align-items:center;gap:10px;z-index:2}
.logo{width:36px;height:36px;border-radius:9px;background:var(--gold);color:var(--green-deep);display:grid;place-items:center;font:400 22px/1 'ZCOOL QingKe HuangYou';box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand-name{font-size:24px}
.brand-sub{font-size:10px;letter-spacing:3px;color:rgba(243,241,228,.55);align-self:flex-end;padding-bottom:4px}
.gear{margin-left:auto;width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#f3f1e4;font-size:17px;cursor:pointer;transition:.25s}
.gear:hover{background:rgba(255,255,255,.22);transform:rotate(60deg)}
.menu{position:absolute;right:16px;top:56px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(23,37,28,.2);overflow:hidden;display:none;z-index:50;min-width:170px}
.menu.open{display:block;animation:popIn .2s}
.menu button{display:flex;gap:8px;align-items:center;width:100%;padding:12px 16px;border:none;background:none;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit}
.menu button:hover{background:var(--green-soft)}
.month-nav{position:relative;z-index:2;display:inline-flex;align-items:center;gap:14px;margin-top:18px;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 8px}
.month-nav button{width:26px;height:26px;border:none;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:16px;cursor:pointer;transition:.2s}
.month-nav button:hover{background:var(--gold);color:var(--green-deep)}
.month-nav span{font-size:16px;min-width:96px;text-align:center;cursor:pointer;padding:2px 8px;border-radius:8px;transition:.2s}
.month-nav span:hover{background:rgba(255,255,255,.18)}

/* ═══ 月份选择弹窗 ═══ */
.mp-mask{position:fixed;inset:0;background:rgba(10,74,52,.55);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.mp-mask.show{opacity:1;pointer-events:auto}
.mp{width:min(380px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.4);transform:scale(.92) translateY(10px);transition:.25s cubic-bezier(.2,.8,.2,1)}
.mp-mask.show .mp{transform:scale(1) translateY(0)}
.mp-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mp-title{flex:1;text-align:center;font-size:24px;color:var(--green-deep);text-shadow:0 1px 0 rgba(14,107,74,.15)}
.mp-nav{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:50%;color:var(--green-deep);font-size:18px;cursor:pointer;transition:.2s;font-family:inherit}
.mp-nav:hover{background:var(--green-soft);border-color:var(--green)}
.mp-close{width:32px;height:32px;border:none;background:transparent;font-size:18px;color:var(--ink2);cursor:pointer;border-radius:50%;font-family:inherit}
.mp-close:hover{background:var(--red-soft);color:var(--red)}
.mp-sub{text-align:center;font-size:11px;letter-spacing:2px;color:var(--ink2);margin:6px 0 10px;font-weight:600}
.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.mp-cell{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.2s;font-family:inherit;position:relative;padding:4px}
.mp-cell:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.mp-cell.has::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);position:absolute;bottom:7px}
.mp-cell.cur{background:var(--green-deep);color:#fff;border-color:var(--green-deep)}
.mp-cell.cur::after{background:var(--gold)}
.mp-cell.future{opacity:.3;pointer-events:none}
.mp-cell.cur.future{opacity:1}
.mp-foot{display:flex;justify-content:center;gap:8px}
.mp-today{border:1px solid var(--line);background:#fff;color:var(--green-deep);padding:8px 16px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.mp-today:hover{background:var(--green-soft);border-color:var(--green)}
.balance{position:relative;z-index:2;margin-top:16px}
.bal-label{font-size:10px;letter-spacing:3px;color:rgba(243,241,228,.6)}
.bal-num{font-size:44px;font-weight:700;margin:4px 0 10px;text-shadow:0 3px 12px rgba(0,0,0,.25)}
.bal-row{display:flex;align-items:center;gap:16px;font-size:13px;color:rgba(243,241,228,.85)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dot.in{background:#5fd3a0}.dot.out{background:#ff9d8a}
.bal-row b{font-weight:600}
.seal{margin-left:auto;font-size:11px;letter-spacing:2px;color:var(--gold);border:1.5px solid rgba(233,185,73,.7);border-radius:5px;padding:3px 7px;transform:rotate(-4deg);opacity:.85}

.panel{display:none}
.panel.active{display:block;animation:panelIn .35s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 0 rgba(23,37,28,.04);animation:cardIn .5s both}
.panel.active .card:nth-of-type(2){animation-delay:.06s}
.panel.active .card:nth-of-type(3){animation-delay:.12s}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sec{display:flex;align-items:center;gap:8px;font-size:17px;margin-bottom:12px}
.sec i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg);border-radius:2px}

/* 记一笔 */
.type-toggle{display:flex;background:#eef1e9;border-radius:12px;padding:4px;margin-bottom:14px}
.type-toggle button{flex:1;padding:9px;border:none;border-radius:9px;background:none;font-size:15px;font-weight:700;color:var(--ink2);cursor:pointer;transition:.25s;font-family:inherit}
.type-toggle button.on[data-t="expense"]{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(200,64,47,.35)}
.type-toggle button.on[data-t="income"]{background:var(--income);color:#fff;box-shadow:0 3px 10px rgba(23,138,95,.35)}
.amount-box{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;padding:6px 4px 12px;border-bottom:2px dashed var(--line);margin-bottom:14px}
.amount-box .cur{font-size:22px;color:var(--ink2)}
.amount-box #amtView{font-size:42px;font-weight:700;font-family:'IBM Plex Mono';border:none;background:none;outline:none;color:var(--ink);text-align:right;min-width:1ch;padding:0;margin:0;width:1ch}
.caret{width:2px;height:34px;background:var(--green);animation:blink 1s steps(1) infinite;align-self:center}
@keyframes blink{50%{opacity:0}}
.amount-box:focus-within .caret{display:none}
.amount-box.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 4px;margin-bottom:14px}
.cat{border:none;background:none;cursor:pointer;text-align:center;font-family:inherit}
.cat .ic{width:46px;height:46px;margin:0 auto 4px;border-radius:50%;background:#f0f3ea;display:grid;place-items:center;font-size:21px;border:2px solid transparent;transition:.2s}
.cat small{font-size:11px;color:var(--ink2)}
.cat:active .ic{transform:scale(.88)}
.cat.on .ic{border-color:var(--green);background:var(--green-soft);transform:scale(1.08)}
.cat.on small{color:var(--green);font-weight:700}
.meta-row{display:flex;gap:8px;margin-bottom:8px}
.meta-row label,.meta-row input[type=text]{flex:1;display:flex;align-items:center;gap:6px;background:#f4f6ef;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px}
.meta-row input{border:none;background:none;outline:none;font-family:inherit;font-size:13px;width:100%;color:var(--ink)}
.name-input{display:flex;align-items:center;gap:6px;background:#f4f6ef;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;margin-bottom:8px}
.name-input input{border:none;background:none;outline:none;font-family:inherit;font-size:14px;width:100%;color:var(--ink);font-weight:500}
.name-input .tag{font-size:11px;color:var(--green);background:var(--green-soft);border-radius:4px;padding:2px 6px;white-space:nowrap}
.editbar{margin-top:12px;padding:10px 12px;background:#fff7e2;border:1px dashed var(--amber);border-radius:10px;font-size:13px;display:flex;align-items:center;gap:8px}
.editbar button{margin-left:auto;border:none;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
#delBtn{background:var(--red);color:#fff}
#cancelEdit{background:#e8ebe2;color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:52px;border:1px solid var(--line);border-radius:10px;background:#fff;font:600 20px 'IBM Plex Mono';color:var(--ink);cursor:pointer;transition:.12s}
.key:active{transform:scale(.93);background:var(--green-soft)}
.key-ok{grid-column:4;grid-row:1/span 4;border:none;border-radius:10px;background:linear-gradient(170deg,#12825b,var(--green-deep));color:#fff;font-size:20px;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 16px rgba(10,74,52,.35);transition:.15s}
.key-ok:active{transform:scale(.96)}
/* 触屏设备：隐藏自定义数字键盘，改用系统键盘，仅保留“记一笔”按钮 */
body.touch .keypad{grid-template-columns:1fr;max-width:320px;margin:0 auto}
body.touch .key{display:none}
body.touch .key-ok{grid-column:auto;grid-row:auto;height:54px;font-size:18px;width:100%}

/* 搜索栏 */
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;transition:border-color .2s,box-shadow .2s}
.search-box:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(14,107,74,.1)}
.search-box .s-icon{font-size:16px;color:var(--ink2)}
.search-box input{flex:1;border:none;outline:none;font-family:inherit;font-size:14px;background:none;color:var(--ink)}
.search-box input::placeholder{color:#aab3a6}
.search-box .s-clear{border:none;background:none;font-size:16px;color:#aab3a6;cursor:pointer;display:none;padding:2px}
.search-box .s-clear.show{display:block}
.search-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.search-tags .stag{font-size:11px;background:#f0f3ea;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;transition:.2s;color:var(--ink2)}
.search-tags .stag:hover,.search-tags .stag.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.search-result-info{font-size:12px;color:var(--ink2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.search-result-info b{color:var(--green)}
mark{background:rgba(233,185,73,.35);color:inherit;border-radius:2px;padding:0 1px}

/* 明细筛选：收入 / 支出 */
.detail-filter{display:flex;gap:8px;margin-bottom:12px}
.df-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.2s}
.df-btn .si{font-size:15px;font-weight:700;line-height:1}
.df-btn[data-f="income"]:hover{border-color:var(--income);color:var(--income)}
.df-btn[data-f="expense"]:hover{border-color:var(--red);color:var(--red)}
.df-btn[data-f="income"].on{background:var(--income);border-color:var(--income);color:#fff;box-shadow:0 3px 10px rgba(23,138,95,.3)}
.df-btn[data-f="expense"].on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 10px rgba(200,64,47,.3)}
.df-btn:active{transform:scale(.97)}

/* 明细 */
.receipt{position:relative;background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;padding:18px 18px 16px;margin-bottom:26px;animation:cardIn .5s both}
.receipt::after{content:'';position:absolute;top:100%;left:-1px;right:-1px;height:12px;background:radial-gradient(circle at 8px 15px,transparent 9px,#fff 9.5px);background-size:16px 12px;background-repeat:repeat-x;filter:drop-shadow(0 1px 0 var(--line))}
.r-head{font-size:20px;margin-bottom:10px}
.r-row{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);padding:5px 0}
.r-row b{color:var(--ink)}
.r-dash{border-top:2px dashed var(--line);margin:8px 0}
.r-row.total{font-size:16px;font-weight:700}.r-row.total b{font-size:18px}
.day-header{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin:14px 2px 8px}
.rec-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;transition:.2s;animation:cardIn .4s both}
.rec-row:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(23,37,28,.1);border-color:var(--green)}
.rec-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.rec-info{flex:1;min-width:0}
.rec-info b{font-size:14px;display:block}
.rec-info .rec-name{font-size:12px;color:var(--green);font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-info small{font-size:11px;color:var(--ink2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-amt{font-size:16px;font-weight:700}
.rec-amt.out{color:var(--red)}.rec-amt.in{color:var(--income)}
.empty{text-align:center;padding:44px 0;color:#9aa496;font-size:14px}
.empty div{font-size:44px;margin-bottom:10px}

/* 统计 */
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-size:13px;color:var(--ink2);cursor:pointer;transition:.2s;font-family:inherit}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 3px 10px rgba(14,107,74,.3)}
.chip:active{transform:scale(.94)}
.range-custom{display:flex;gap:8px;margin-bottom:12px}
.range-custom input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;background:#fff}
.stat-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-bottom:10px}
.sg-big{grid-row:1/3;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(160deg,#12825b,var(--green-deep))!important;border:none!important;color:#fff}
.sg-big label,.sg-small label{font-size:11px;letter-spacing:2px;opacity:.75}
.sg-big .big{font-size:32px;font-weight:700;margin:6px 0}
.sg-small .big{font-size:19px;font-weight:700;margin-top:6px}
.sg-small{display:flex;flex-direction:column;justify-content:center}
.cmp{font-size:11px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px;align-self:flex-start}
.mini-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:0 4px 14px}
.mini-row b{color:var(--ink)}
.top3{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.top3 span{font-size:12px;background:#f4f6ef;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.top3 span b{color:var(--green)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-wrap svg{width:150px;height:150px;flex-shrink:0}
.donut-c1{fill:none;stroke:#eef1e9;stroke-width:22}
.donut-seg{fill:none;stroke-width:22;transition:stroke-dasharray .9s cubic-bezier(.4,0,.2,1)}
.donut-center{font:700 15px 'IBM Plex Mono';fill:var(--ink)}
.donut-sub{font-size:9px;fill:var(--ink2);letter-spacing:2px}
.legend{flex:1;min-width:0}
.lg-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0}
.lg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.lg-name{width:34px;color:var(--ink2)}
.lg-bar{flex:1;height:6px;background:#eef1e9;border-radius:3px;overflow:hidden}
.lg-bar i{display:block;height:100%;border-radius:3px;width:0;transition:width .8s cubic-bezier(.4,0,.2,1)}
.lg-amt{font-size:11px;font-weight:600;width:64px;text-align:right}
.lg-pct{width:36px;text-align:right;color:var(--ink2);font-size:11px}
.mini-chips{margin-left:auto;display:flex;gap:6px}
.mini-chips .chip{padding:4px 12px;font-size:11px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.bar{flex:1;min-width:3px;border-radius:4px 4px 0 0;position:relative;cursor:pointer;height:0;transition:height .7s cubic-bezier(.4,0,.2,1),filter .2s}
.bar:hover{filter:brightness(1.15)}
.bar:hover::after{content:attr(data-v);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;padding:2px 6px;border-radius:5px;white-space:nowrap;font-family:'IBM Plex Mono'}
.bar.exp{background:linear-gradient(180deg,#e76f51,#c8402f)}
.bar.inc{background:linear-gradient(180deg,#3aa57a,#178a5f)}
.bars-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);margin-top:6px}

/* 预算 */
.bud-input{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;margin-bottom:14px}
.bud-input input{border:none;border-bottom:2px solid var(--line);background:none;font:700 26px 'IBM Plex Mono';width:150px;outline:none;color:var(--green);padding:2px 0;transition:border-color .2s}
.bud-input input:focus{border-color:var(--green)}
.pbar{height:14px;background:#eef1e9;border-radius:7px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#2f9e6e,var(--green));transition:width .8s cubic-bezier(.4,0,.2,1)}
.pbar i.warn{background:linear-gradient(90deg,#f0b429,#e08a00)}
.pbar i.over{background:linear-gradient(90deg,#e76f51,var(--red))}
.bud-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:8px}
.bud-meta b{color:var(--ink)}
.bud-row{padding:12px 0;border-bottom:1px dashed var(--line)}
.bud-row:last-child{border:none}
.bud-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bud-top .rec-ic{width:34px;height:34px;font-size:16px}
.bud-top b{font-size:14px;flex:1}
.bud-top input{width:86px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:600 13px 'IBM Plex Mono';text-align:right;outline:none}
.bud-top input:focus{border-color:var(--green)}
.bud-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-top:6px}
.bud-sub .over-t{color:var(--red);font-weight:700}
.bud-row .pbar{height:8px}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;border:none;background:none;padding:6px 0 4px;cursor:pointer;position:relative;color:var(--ink2);font-family:inherit}
.tab::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) scaleX(0);width:26px;height:3px;border-radius:2px;background:var(--green);transition:transform .3s}
.tab span{display:block;font-size:22px;transition:transform .25s}
.tab small{font-size:11px}
.tab.on{color:var(--green)}
.tab.on small{font-weight:700}
.tab.on::before{transform:translateX(-50%) scaleX(1)}
.tab.on span{transform:translateY(-3px) scale(1.18)}

.toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.35s;z-index:99;box-shadow:0 8px 24px rgba(23,37,28,.35);max-width:88vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(-6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="ambient"><span>¥</span><span>¥</span><span>¥</span><span>¥</span></div>

<div class="app">
  <header class="app-head">
    <div class="glow"></div>
    <div class="head-top">
      <span class="logo">¥</span>
      <span class="brand-name disp">随手账</span>
      <span class="brand-sub">LEDGER</span>
      <button class="gear" id="gearBtn">⚙</button>
    </div>
    <div class="menu" id="menu">
      <button id="mExport">📤 导出 CSV</button>
      <button id="mBackup">💾 备份 JSON</button>
      <button id="mImport">📥 导入数据</button>
      <button id="mClear">🗑 清空所有数据</button>
    </div>
    <div class="month-nav">
      <button id="mPrev">‹</button><span id="mLabel" class="disp"></span><button id="mNext">›</button>
    </div>
    <div class="balance">
      <div class="bal-label">本月结余 BALANCE</div>
      <div class="bal-num mono" id="balNum">¥0.00</div>
      <div class="bal-row">
        <span><i class="dot in"></i>收入 <b class="mono" id="balIn">0.00</b></span>
        <span><i class="dot out"></i>支出 <b class="mono" id="balOut">0.00</b></span>
        <span class="seal disp">日清月结</span>
      </div>
    </div>
  </header>

  <main>
    <!-- ═══ 记一笔 ═══ -->
    <section class="panel active" id="panel-0">
      <div class="card">
        <div class="type-toggle">
          <button data-t="expense" class="on">支 出</button>
          <button data-t="income">收 入</button>
        </div>
        <div class="amount-box" id="amtBox">
          <span class="cur">¥</span><input id="amtView" class="mono" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done"><span class="caret"></span>
        </div>
        <div class="cat-grid" id="catGrid" style="margin-top:14px"></div>
        <!-- ★ 新增：自定义名称 -->
        <div class="name-input">
          <span class="tag">名称</span>
          <input type="text" id="recName" placeholder="给这笔账起个名字，如：星巴克拿铁" maxlength="20">
        </div>
        <div class="meta-row">
          <label>📅 <input type="date" id="recDate"></label>
          <input type="text" id="recNote" placeholder="备注（可选）" maxlength="30">
        </div>
        <div class="editbar" id="editBar" hidden>✏️ 正在编辑记录
          <button id="cancelEdit">取消</button><button id="delBtn">删除</button>
        </div>
      </div>
      <div class="keypad" id="keypad">
        <button class="key-ok disp" id="okBtn">记一笔</button>
        <button class="key">1</button><button class="key">2</button><button class="key">3</button>
        <button class="key">4</button><button class="key">5</button><button class="key">6</button>
        <button class="key">7</button><button class="key">8</button><button class="key">9</button>
        <button class="key">.</button><button class="key">0</button><button class="key" data-k="del">⌫</button>
      </div>
    </section>

    <!-- ═══ 明细 + 搜索 ═══ -->
    <section class="panel" id="panel-1">
      <!-- ★ 新增：搜索栏 -->
      <div class="search-box" id="searchBox">
        <span class="s-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索名称、备注、分类…" maxlength="30">
        <button class="s-clear" id="searchClear">✕</button>
      </div>
      <div class="search-tags" id="searchTags"></div>
      <!-- ★ 新增：明细收入/支出筛选 -->
      <div class="detail-filter" id="detailFilter">
        <button class="df-btn" data-f="income"><span class="si">↑</span>收入</button>
        <button class="df-btn" data-f="expense"><span class="si">↓</span>支出</button>
      </div>
      <div class="search-result-info" id="searchInfo" hidden></div>

      <div class="receipt" id="receiptCard">
        <div class="r-head disp" id="rcTitle"></div>
        <div class="r-row"><span>收入合计</span><b class="mono" id="rcIn"></b></div>
        <div class="r-row"><span>支出合计</span><b class="mono" id="rcOut"></b></div>
        <div class="r-dash"></div>
        <div class="r-row total"><span>本月结余</span><b class="mono" id="rcBal"></b></div>
      </div>
      <div id="dayList"></div>
    </section>

    <!-- ═══ 统计 ═══ -->
    <section class="panel" id="panel-2">
      <div class="chips" id="stChips">
        <button class="chip" data-p="week">本周</button>
        <button class="chip on" data-p="month">本月</button>
        <button class="chip" data-p="year">本年</button>
        <button class="chip" data-p="custom">自定义</button>
      </div>
      <div class="range-custom" id="stCustom" hidden>
        <input type="date" id="stStart"><input type="date" id="stEnd">
      </div>
      <div class="stat-grid">
        <div class="card sg-big"><label>总支出 EXPENSE</label><div class="mono big" id="stExp">¥0.00</div><span class="cmp" id="stCmp"></span></div>
        <div class="card sg-small"><label>总收入</label><div class="mono big" id="stIn">¥0.00</div></div>
        <div class="card sg-small"><label>结余</label><div class="mono big" id="stBal">¥0.00</div></div>
      </div>
      <div class="mini-row"><span>日均支出 <b class="mono" id="stAvg">¥0.00</b></span><span>共 <b id="stCnt">0</b> 笔</span></div>
      <div class="card">
        <h3 class="sec"><i></i>支出分类</h3>
        <div class="top3" id="stTop3"></div>
        <div class="donut-wrap" id="donutWrap">
          <svg viewBox="0 0 160 160" id="donut"></svg>
          <div class="legend" id="stLegend"></div>
        </div>
        <div class="empty" id="stEmpty" hidden><div>🍃</div>这个时间段还没有支出记录</div>
      </div>
      <div class="card">
        <h3 class="sec"><i></i>收支趋势
          <span class="mini-chips" id="trendChips">
            <button class="chip on" data-tt="expense">支出</button>
            <button class="chip" data-tt="income">收入</button>
          </span>
        </h3>
        <div class="bars" id="stBars"></div>
        <div class="bars-axis" id="stAxis"></div>
      </div>
    </section>

    <!-- ═══ 预算 ═══ -->
    <section class="panel" id="panel-3">
      <div class="card">
        <h3 class="sec"><i></i>本月总预算</h3>
        <div class="bud-input">¥ <input id="budTotal" type="number" min="0" step="100" placeholder="0"></div>
        <div class="pbar"><i id="budBar"></i></div>
        <div class="bud-meta"><span>已用 <b class="mono" id="budSpent">¥0.00</b></span><span id="budLeft">剩余 <b class="mono">¥0.00</b></span></div>
      </div>
      <div class="card">
        <h3 class="sec"><i></i>分类预算</h3>
        <div id="budList"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab on" data-tab="0"><span>✍️</span><small>记账</small></button>
    <button class="tab" data-tab="1"><span>🧾</span><small>明细</small></button>
    <button class="tab" data-tab="2"><span>📊</span><small>统计</small></button>
    <button class="tab" data-tab="3"><span>🎯</span><small>预算</small></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<!-- ★ 月份选择弹窗 -->
<div class="mp-mask" id="mpMask">
  <div class="mp" role="dialog" aria-label="选择月份">
    <div class="mp-head">
      <button class="mp-nav" id="mpPrev">‹</button>
      <div class="mp-title disp" id="mpYear">2026</div>
      <button class="mp-nav" id="mpNext">›</button>
      <button class="mp-close" id="mpClose" aria-label="关闭">✕</button>
    </div>
    <div class="mp-sub">SELECT MONTH · 选择月份</div>
    <div class="mp-grid" id="mpGrid"></div>
    <div class="mp-foot">
      <button class="mp-today" id="mpToday">📍 回到本月</button>
    </div>
  </div>
</div>

<script>
/* ══════════ 基础数据 ══════════ */
const CATS={
  expense:[
    {id:'food',name:'餐饮',icon:'🍜'},{id:'transport',name:'交通',icon:'🚌'},
    {id:'shopping',name:'购物',icon:'🛍️'},{id:'home',name:'居住',icon:'🏠'},
    {id:'fun',name:'娱乐',icon:'🎮'},{id:'medical',name:'医疗',icon:'💊'},
    {id:'study',name:'学习',icon:'📚'},{id:'social',name:'人情',icon:'🧧'},
    {id:'telecom',name:'通讯',icon:'📱'},{id:'other',name:'其他',icon:'🧾'}],
  income:[
    {id:'salary',name:'工资',icon:'💰'},{id:'bonus',name:'奖金',icon:'🎁'},
    {id:'invest',name:'投资',icon:'📈'},{id:'side',name:'兼职',icon:'💼'},
    {id:'refund',name:'报销',icon:'🔄'},{id:'otherin',name:'其他',icon:'📦'}]
};
const PAL_E=['#0e6b4a','#2f9e6e','#7fb069','#e9b949','#f0994e','#e76f51','#c8402f','#437f8c','#8a5a44','#6b705c'];
const PAL_I=['#178a5f','#3aa57a','#63b98f','#8fcbab','#b7dcc7','#0e6b4a'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=n=>Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ds(new Date());
const catOf=(t,id)=>CATS[t].find(c=>c.id===id)||CATS[t][CATS[t].length-1];
const colorOf=(t,id)=>(t==='expense'?PAL_E:PAL_I)[CATS[t].findIndex(c=>c.id===id)%10]||'#0e6b4a';

let records=JSON.parse(localStorage.getItem('ledger_records')||'[]');
let budgets=JSON.parse(localStorage.getItem('ledger_budgets')||'{}');
const save=()=>{localStorage.setItem('ledger_records',JSON.stringify(records));localStorage.setItem('ledger_budgets',JSON.stringify(budgets));};

const now=new Date();
let viewMonth={y:now.getFullYear(),m:now.getMonth()+1};
let recType='expense',recCat='food',amountStr='',editingId=null;
let stPreset='month',trendType='expense';
let stStart=ds(new Date(now.getFullYear(),now.getMonth(),1)),stEnd=todayStr();
let searchKeyword=''; // ★ 搜索关键词
let detailFilter=''; // ★ 明细收入/支出筛选：'' / 'income' / 'expense'

/* ══════════ 工具 ══════════ */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1900);}
function countUp(el,to,pre='¥'){const from=parseFloat(el.dataset.v||0);el.dataset.v=to;const t0=performance.now(),dur=550;
  (function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3),v=from+(to-from)*e;
    el.textContent=(v<0?'-':'')+pre+fmt(v);if(p<1)requestAnimationFrame(step);})(t0);}
function sum(list,type){return list.filter(r=>r.type===type).reduce((s,r)=>s+r.amount,0);}
function monthKey(){return `${viewMonth.y}-${pad(viewMonth.m)}`;}
function inRange(r,s,e){return r.date>=s&&r.date<=e;}
function dayCount(s,e){return Math.round((new Date(e)-new Date(s))/864e5)+1;}
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function getRange(){
  const t=new Date();
  if(stPreset==='week'){const s=mondayOf(t);return[ds(s),ds(t)];}
  if(stPreset==='month')return[ds(new Date(t.getFullYear(),t.getMonth(),1)),ds(t)];
  if(stPreset==='year')return[`${t.getFullYear()}-01-01`,ds(t)];
  return[stStart,stEnd];
}
function catAgg(list,type){
  const m={};list.filter(r=>r.type===type).forEach(r=>{m[r.category]=(m[r.category]||0)+r.amount;});
  const total=Object.values(m).reduce((a,b)=>a+b,0);
  return Object.entries(m).map(([id,amt])=>({cat:catOf(type,id),amt,count:list.filter(r=>r.category===id&&r.type===type).length,pct:total?amt/total*100:0})).sort((a,b)=>b.amt-a.amt);
}
/* ★ 高亮关键词 */
function hl(text){
  if(!searchKeyword||!text)return text||'';
  const kw=searchKeyword.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(`(${kw})`,'gi'),'<mark>$1</mark>');
}
/* ★ 搜索匹配 */
function matchSearch(r){
  if(!searchKeyword)return true;
  const kw=searchKeyword.toLowerCase();
  const c=catOf(r.type,r.category);
  return (r.name||'').toLowerCase().includes(kw)

    ||(r.note||'').toLowerCase().includes(kw)
    ||c.name.toLowerCase().includes(kw);
}

/* ══════════ 顶部 & 明细 ══════════ */
function monthList(){const k=monthKey();return records.filter(r=>r.date.startsWith(k));}
function renderHeader(){
  $('mLabel').textContent=`${viewMonth.y}年${viewMonth.m}月`;
  const list=monthList(),inc=sum(list,'income'),exp=sum(list,'expense');
  countUp($('balNum'),inc-exp);
  $('balIn').textContent=fmt(inc);$('balOut').textContent=fmt(exp);
}
function renderDetails(){
  // 同步筛选按钮高亮状态
  document.querySelectorAll('#detailFilter .df-btn').forEach(x=>x.classList.toggle('on',x.dataset.f===detailFilter));
  const allList=monthList();
  let list=allList;
  if(searchKeyword)list=list.filter(matchSearch);
  if(detailFilter)list=list.filter(r=>r.type===detailFilter);
  // 小票汇总（搜索/筛选时显示对应结果汇总）
  const ft=detailFilter?(detailFilter==='income'?'收入':'支出')+' · ':'';
  $('rcTitle').textContent=searchKeyword?`搜索结果 · ${viewMonth.m}月`:`${ft}${viewMonth.m}月账单 · ${viewMonth.y}`;
  const inc=sum(list,'income'),exp=sum(list,'expense');
  $('rcIn').textContent='¥'+fmt(inc);$('rcOut').textContent='¥'+fmt(exp);
  const bal=inc-exp;$('rcBal').textContent=(bal<0?'-':'')+'¥'+fmt(bal);
  $('rcBal').style.color=bal<0?'var(--red)':'var(--income)';
  // 搜索 / 筛选信息
  const info=$('searchInfo');
  const tags=[];
  if(detailFilter)tags.push(detailFilter==='income'?'收入':'支出');
  if(searchKeyword)tags.push(`「${searchKeyword}」`);
  if(tags.length){
    info.hidden=false;
    info.innerHTML=`${searchKeyword?`🔍 找到 <b>${list.length}</b> 条`:`共 <b>${list.length}</b> 条`}（${tags.join(' + ')}）`;
  }else info.hidden=true;
  // 快捷搜索标签
  renderSearchTags(allList);
  // 列表
  const box=$('dayList');
  if(!list.length){
    const isFilter=detailFilter||searchKeyword;
    box.innerHTML=isFilter
      ?`<div class="empty"><div>🔍</div>${detailFilter?(detailFilter==='income'?'收入':'支出')+' ':''}${searchKeyword?'关键词 ':''}筛选下没有记录<br>换个条件试试？</div>`
      :'<div class="empty"><div>🗒️</div>这个月还没有记录<br>去记第一笔吧～</div>';
    return;
  }
  const byDate={};list.forEach(r=>(byDate[r.date]=byDate[r.date]||[]).push(r));
  const wk=['日','一','二','三','四','五','六'];
  box.innerHTML=Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).map(date=>{
    const day=byDate[date].sort((a,b)=>b.createdAt-a.createdAt);
    const d=new Date(date),de=sum(day,'expense'),di=sum(day,'income');
    return `<div class="day-header"><span>${d.getMonth()+1}月${d.getDate()}日 周${wk[d.getDay()]}</span>
      <span class="mono">支 ¥${fmt(de)}${di?` · 收 ¥${fmt(di)}`:''}</span></div>`+
      day.map((r,i)=>{const c=catOf(r.type,r.category),col=colorOf(r.type,r.category);
        return `<div class="rec-row" data-id="${r.id}" style="animation-delay:${i*.04}s">
          <span class="rec-ic" style="background:${col}22">${c.icon}</span>
          <span class="rec-info">
            <b>${hl(c.name)}</b>
            ${r.name?`<span class="rec-name">${hl(r.name)}</span>`:''}
            <small>${r.note?hl(r.note):r.date}</small>
          </span>
          <span class="rec-amt mono ${r.type==='expense'?'out':'in'}">${r.type==='expense'?'-':'+'}${fmt(r.amount)}</span></div>`;}).join('');
  }).join('');
  box.querySelectorAll('.rec-row').forEach(el=>el.onclick=()=>startEdit(el.dataset.id));
}
/* ★ 快捷搜索标签：从已有记录中提取高频名称 */
function renderSearchTags(list){
  const names={};
  list.forEach(r=>{if(r.name)names[r.name]=(names[r.name]||0)+1;});
  const top=Object.entries(names).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const cats=[...new Set(list.map(r=>catOf(r.type,r.category).name))].slice(0,4);
  const tags=[...top.map(([n])=>n),...cats];
  $('searchTags').innerHTML=tags.slice(0,10).map(t=>
    `<span class="stag ${searchKeyword===t?'on':''}" data-v="${t}">${t}</span>`).join('');
}
$('searchTags').addEventListener('click',e=>{
  const s=e.target.closest('.stag');if(!s)return;
  const v=s.dataset.v;
  searchKeyword=searchKeyword===v?'':v;
  $('searchInput').value=searchKeyword;
  $('searchClear').classList.toggle('show',!!searchKeyword);
  renderDetails();
});
$('searchInput').addEventListener('input',e=>{
  searchKeyword=e.target.value.trim();
  $('searchClear').classList.toggle('show',!!searchKeyword);
  renderDetails();
});
$('searchClear').onclick=()=>{
  searchKeyword='';$('searchInput').value='';
  $('searchClear').classList.remove('show');renderDetails();
};
/* ★ 明细收入/支出筛选：点击切换，再次点击取消 */
$('detailFilter').addEventListener('click',e=>{
  const b=e.target.closest('.df-btn');if(!b)return;
  const f=b.dataset.f;
  detailFilter=detailFilter===f?'':f;
  document.querySelectorAll('#detailFilter .df-btn').forEach(x=>x.classList.toggle('on',x.dataset.f===detailFilter));
  renderDetails();
});

/* ══════════ 统计 ══════════ */
function renderStats(){
  const [s,e]=getRange(),list=records.filter(r=>inRange(r,s,e));
  const inc=sum(list,'income'),exp=sum(list,'expense'),days=dayCount(s,e);
  const effDays=Math.max(1,Math.min(days,dayCount(s,e>todayStr()?todayStr():e)));
  countUp($('stExp'),exp);countUp($('stIn'),inc);countUp($('stBal'),inc-exp);
  $('stAvg').textContent='¥'+fmt(exp/effDays);$('stCnt').textContent=list.length;
  const len=dayCount(s,e),pe=new Date(s);pe.setDate(pe.getDate()-1);
  const ps=new Date(pe);ps.setDate(ps.getDate()-(len-1));
  const prevExp=sum(records.filter(r=>inRange(r,ds(ps),ds(pe))),'expense');
  const cmp=$('stCmp');
  if(prevExp>0){const p=(exp-prevExp)/prevExp*100;
    cmp.textContent=`比上一周期 ${p>=0?'↑':'↓'} ${Math.abs(p).toFixed(0)}%`;
    cmp.style.background=p>=0?'rgba(255,157,138,.3)':'rgba(95,211,160,.3)';cmp.hidden=false;
  }else cmp.hidden=true;
  const agg=catAgg(list,'expense');
  if(!agg.length){$('donutWrap').hidden=true;$('stTop3').innerHTML='';$('stEmpty').hidden=false;}
  else{
    $('stEmpty').hidden=true;$('donutWrap').hidden=false;
    $('stTop3').innerHTML=agg.slice(0,3).map((a,i)=>`<span>${['🥇','🥈','🥉'][i]} <b>${a.cat.name}</b> ¥${fmt(a.amt)}</span>`).join('');
    drawDonut(agg,exp);
    $('stLegend').innerHTML=agg.map(a=>{const col=PAL_E[CATS.expense.findIndex(c=>c.id===a.cat.id)%10];
      return `<div class="lg-row"><span class="lg-dot" style="background:${col}"></span>
        <span class="lg-name">${a.cat.name}</span>
        <span class="lg-bar"><i data-w="${a.pct}" style="background:${col}"></i></span>
        <span class="lg-amt mono">¥${fmt(a.amt)}</span><span class="lg-pct">${a.pct.toFixed(1)}%</span></div>`;}).join('');
    requestAnimationFrame(()=>requestAnimationFrame(()=>
      document.querySelectorAll('.lg-bar i').forEach(i=>i.style.width=i.dataset.w+'%')));
  }
  renderTrend(s,e,list);
}
function drawDonut(agg,total){
  const svg=$('donut'),R=58,C=2*Math.PI*R;let acc=0;
  let html=`<circle class="donut-c1" cx="80" cy="80" r="${R}"/>`;
  agg.forEach(a=>{
    const col=PAL_E[CATS.expense.findIndex(c=>c.id===a.cat.id)%10];
    const len=a.amt/total*C;
    html+=`<circle class="donut-seg" cx="80" cy="80" r="${R}" stroke="${col}"
      stroke-dasharray="0 ${C}" data-len="${Math.max(len-1.5,0)}" data-acc="${acc}"
      transform="rotate(-90 80 80)"><title>${a.cat.name} ¥${fmt(a.amt)}</title></circle>`;
    acc+=len;
  });
  html+=`<text class="donut-center" x="80" y="78" text-anchor="middle">¥${total>=10000?(total/10000).toFixed(1)+'万':fmt(total)}</text>
         <text class="donut-sub" x="80" y="96" text-anchor="middle">总支出</text>`;
  svg.innerHTML=html;
  requestAnimationFrame(()=>requestAnimationFrame(()=>
    svg.querySelectorAll('.donut-seg').forEach(seg=>{
      const len=+seg.dataset.len,acc=+seg.dataset.acc;
      seg.style.strokeDasharray=`${len} ${C-len}`;seg.style.strokeDashoffset=-acc;
    })));
}
function renderTrend(s,e,list){
  const days=dayCount(s,e),buckets=[];
  if(days<=31){
    for(let d=new Date(s);ds(d)<=e;d.setDate(d.getDate()+1)){
      const k=ds(d);buckets.push({label:`${d.getMonth()+1}/${d.getDate()}`,
        expense:sum(list.filter(r=>r.date===k),'expense'),income:sum(list.filter(r=>r.date===k),'income')});}
  }else if(days<=140){
    for(let d=new Date(s);ds(d)<=e;d.setDate(d.getDate()+7)){
      const end=new Date(d);end.setDate(end.getDate()+6);const ek=ds(end)>e?e:ds(end);
      buckets.push({label:`${d.getMonth()+1}/${d.getDate()}`,
        expense:sum(list.filter(r=>inRange(r,ds(d),ek)),'expense'),income:sum(list.filter(r=>inRange(r,ds(d),ek)),'income')});}
  }else{
    const m={};list.forEach(r=>{const k=r.date.slice(0,7);m[k]=(m[k]||{e:0,i:0});
      r.type==='expense'?m[k].e+=r.amount:m[k].i+=r.amount;});
    for(let d=new Date(s+'-01');ds(d)<=e;d.setMonth(d.getMonth()+1)){
      const k=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
      buckets.push({label:`${d.getMonth()+1}月`,expense:(m[k]||{}).e||0,income:(m[k]||{}).i||0});}
  }
  const max=Math.max(...buckets.map(b=>b[trendType]),1);
  $('stBars').innerHTML=buckets.map(b=>{const v=b[trendType];
    return `<div class="bar ${trendType==='expense'?'exp':'inc'}" data-h="${v/max*100}"
      data-v="¥${fmt(v)}" style="height:0;${v?'':'opacity:.25;min-height:2px'}"></div>`;}).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>
    document.querySelectorAll('.bar').forEach(b=>b.style.height=Math.max(+b.dataset.h,2)+'%')));
  $('stAxis').innerHTML=buckets.length>1?
    `<span>${buckets[0].label}</span><span>${buckets[Math.floor(buckets.length/2)].label}</span><span>${buckets[buckets.length-1].label}</span>`
    :`<span>${buckets[0]?.label||''}</span>`;
}

/* ★ 分类中文名 -> id */
function catIdFromName(name,type){const c=CATS[type].find(x=>x.name===name);return c?c.id:(type==='income'?'otherin':'other');}
/* ★ 解析 CSV（兼容带引号、双引号转义、千分位逗号） */
function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,'');
  const rows=[];let row=[],field='',i=0,q=false;
  while(i<txt.length){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){field+='"';i++;} else q=false; } else field+=c; }
    else{ if(c==='"')q=true; else if(c===','){row.push(field);field='';} else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';} else if(c!=='\r')field+=c; }
    i++;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  if(rows.length<2)return [];
  const header=rows[0].map(h=>h.trim());
  const col=n=>header.indexOf(n);
  const iD=col('日期'),iT=col('类型'),iC=col('分类'),iN=col('名称'),iA=col('金额'),iB=col('备注');
  if(iD<0||iA<0)return [];
  return rows.slice(1).map(r=>({
    date:r[iD]||'', type:r[iT]==='收入'?'income':'expense',
    catName:r[iC]||'', name:r[iN]||'', amount:parseFloat(String(r[iA]||'').replace(/,/g,'')), note:r[iB]||''
  })).filter(r=>r.date&&!isNaN(r.amount)&&r.amount>0);
}
/* ★ 解析 JSON（支持本工具备份格式 {records,budgets} 或纯数组） */
function parseJSON(txt){
  const data=JSON.parse(txt);
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.records)){ if(data.budgets)budgets=Object.assign({},budgets,data.budgets); return data.records; }
  return [];
}
$('mExport').onclick=()=>{

      [r.date,r.type==='expense'?'支出':'收入',catOf(r.type,r.category).name,r.name||'',r.amount,r.note||''])];
  const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='记账数据.csv';a.click();toast('已导出 CSV 📤');
};

/* ★ 导入数据（自动识别 CSV / JSON，支持 覆盖/合并 两种模式） */
$('mImport').onclick=e=>{
  e.stopPropagation();                 // 防止菜单立即关闭干扰文件选择
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.csv,.json,text/csv,application/json';
  /* ★ 关键修复：iOS Safari 要求文件框必须在 DOM 中且为渲染状态，否则 .click() 静默失败 */
  inp.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px';
  document.body.appendChild(inp);
  inp.onchange=()=>{
    const f=inp.files[0];
    if(f&&inp.parentNode)inp.parentNode.removeChild(inp);
    if(!f)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const txt=String(reader.result);
        const imported=(/^\s*[\[{]/.test(txt)||f.name.toLowerCase().endsWith('.json'))
          ?parseJSON(txt):parseCSV(txt);
        if(!imported||!imported.length)return toast('文件中没有可导入的记录');
        const recs=imported.filter(r=>r.date&&+r.amount>0).map(src=>({
          id:src.id||(Date.now()+''+Math.random().toString(16).slice(2,6)),
          type:src.type==='income'?'income':'expense',
          amount:Math.round(+src.amount*100)/100,
          category:src.category||catIdFromName(src.catName||'',src.type==='income'?'income':'expense'),
          name:src.name||'',date:src.date,note:src.note||'',createdAt:src.createdAt||Date.now()}));
        if(!recs.length)return toast('文件中没有可导入的记录');
        /* 覆盖 / 合并 二选一 */
        if(confirm(`即将导入 ${recs.length} 条记录。\n\n点「确定」= 覆盖现有全部数据\n点「取消」= 合并（自动去重）到现有数据`)){
          records=recs;
          toast(`已覆盖导入 ${recs.length} 条记录 📥`);
        }else{
          let added=0;
          recs.forEach(rec=>{
            if(records.some(x=>x.date===rec.date&&x.type===rec.type&&x.category===rec.category
                &&x.amount===rec.amount&&(x.name||'')===(rec.name||'')&&(x.note||'')===(rec.note||'')))return;
            records.push(rec);added++;
          });
          if(!added)return toast('没有新记录（可能已存在）');
          toast(`已合并导入 ${added} 条记录 📥`);
        }
        save();renderAll();
      }catch(err){console.error(err);toast('文件解析失败，请检查格式');}
    };
    reader.readAsText(f);
  };
  inp.click();
  $('menu').classList.remove('open');  // 选完文件后再关闭菜单
};
